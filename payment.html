<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment · CartLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">Cart<span>Ledger</span></div>
  <nav>
    <a href="shop.html">Shop</a>
    <a href="checkout.html" class="active">Cart & Orders</a>
    <span class="cart-pill"><span id="cart-count">0</span> in cart</span>
    <a href="#" onclick="logout()">Log out (<span id="who"></span>)</a>
  </nav>
</div>

<div class="page" style="max-width:640px;">
  <div class="card">
    <h2>Payment</h2>
    <p class="muted">This is a demo checkout — no real payment is processed.</p>

    <table style="margin-bottom:8px;">
      <thead><tr><th>Item</th><th>Qty</th><th>Total</th></tr></thead>
      <tbody id="pay-summary-body"></tbody>
      <tfoot><tr class="total-row"><td colspan="2">Amount due</td><td id="pay-total">₹0</td></tr></tfoot>
    </table>

    <form id="payment-form">
      <label style="margin-top:14px;">Payment method</label>
      <div class="pay-method-row">
        <label class="pay-method-opt">
          <input type="radio" name="pay-method" value="online" checked>
          <span>💳 Pay online</span>
        </label>
        <label class="pay-method-opt">
          <input type="radio" name="pay-method" value="cod">
          <span>💵 Cash on delivery</span>
        </label>
      </div>

      <div id="pay-card-fields">
        <label for="pay-name">Name on card</label>
        <input id="pay-name" type="text" required value="Test Customer">
        <label for="pay-card">Card number</label>
        <input id="pay-card" type="text" required placeholder="4111 1111 1111 1111" value="4111 1111 1111 1111" maxlength="19">
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;">
          <div><label for="pay-exp">Expiry</label><input id="pay-exp" type="text" required placeholder="MM/YY" value="12/29" maxlength="5"></div>
          <div><label for="pay-cvv">CVV</label><input id="pay-cvv" type="text" required placeholder="123" value="123" maxlength="3"></div>
        </div>
      </div>

      <button class="btn" style="width:100%;margin-top:16px;"><span id="pay-submit-label">Pay now</span></button>
    </form>
  </div>
</div>

<script src="js/script.js"></script>
<script>initPaymentPage();</script>
</body>
</html>
