<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login · CartLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h2 style="margin-bottom:2px;">Cart<span style="color:var(--amber)">Ledger</span></h2>
    <p class="muted" style="margin-top:0;">E-Commerce Database Management System</p>

    <div class="auth-tabs">
      <button id="tab-login" class="active">Log in</button>
      <button id="tab-register">Create account</button>
    </div>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" required value="customer@store.com">
      <label for="login-pass">Password</label>
      <input id="login-pass" type="password" required value="pass123">
      <div class="form-error" id="login-error"></div>
      <button class="btn" style="width:100%;margin-top:8px;">Log in</button>
      <p class="muted" style="margin-top:14px;">Demo accounts — Admin: admin@store.com / admin123 &nbsp;·&nbsp; Customer: customer@store.com / pass123</p>
    </form>

    <form id="register-form" style="display:none;">
      <label for="reg-name">Full name</label>
      <input id="reg-name" type="text" required>
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" required>
      <label for="reg-pass">Password</label>
      <input id="reg-pass" type="password" required minlength="6">
      <div class="form-error" id="reg-error"></div>
      <button class="btn" style="width:100%;margin-top:8px;">Create account</button>
    </form>
  </div>
</div>
<script src="js/script.js"></script>
<script>initAuthPage();</script>
</body>
</html>
